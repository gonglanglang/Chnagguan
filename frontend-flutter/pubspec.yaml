publish_to: 'none'
version: 2.0.1+201

environment:
  sdk: ^3.13.4
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  welkui_flutter: ^0.2.2
  provider: ^6.1.2
