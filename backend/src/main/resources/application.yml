server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: guoguanla-backend
  profiles:
    active: dev
  mvc:
    async:
      request-timeout: 600000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 2MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  jwt-secret-key: ${JWT_SECRET:guoguanla-dev-jwt-secret-key-please-override-in-prod-2026}

guoguanla:
  seed:
    enabled: true
  upload-dir: ${UPLOAD_DIR:./downloads}
  github:
    token: ${GITHUB_TOKEN:}
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:oss-cn-shenzhen.aliyuncs.com}
    internal-endpoint: ${OSS_INTERNAL_ENDPOINT:}
    custom-domain: ${OSS_CUSTOM_DOMAIN:}
    bucket: ${OSS_BUCKET:chuangguang}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    dir-prefix: ${OSS_DIR_PREFIX:essay-answers}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
